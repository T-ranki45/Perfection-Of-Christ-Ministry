<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Mic Monitor | Perfection Of Christ Ministry</title>
    <link rel="icon" href="./image/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="./image/logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Sora:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1118;
        --panel: rgba(15, 23, 36, 0.88);
        --accent: #d4a43f;
        --text: #f7f4ec;
        --muted: #aab2c0;
        --danger: #c0392b;
        --success: #2ecc71;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Sora", sans-serif;
        background: radial-gradient(circle at top, #18233a 0%, #0b1118 55%);
        color: var(--text);
        min-height: 100vh;
        padding: 2rem;
      }

      .mic-shell {
        max-width: 980px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .mic-header h1 {
        font-family: "Playfair Display", serif;
        font-size: clamp(1.8rem, 3vw, 2.6rem);
        margin-bottom: 0.4rem;
      }

      .mic-header p {
        color: var(--muted);
      }

      .mic-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.2rem;
      }

      .mic-card {
        background: var(--panel);
        border-radius: 16px;
        padding: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .mic-card h3 {
        font-family: "Playfair Display", serif;
        font-size: 1.3rem;
      }

      label span {
        display: block;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--accent);
        margin-bottom: 0.4rem;
      }

      input,
      select {
        width: 100%;
        padding: 0.6rem 0.8rem;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(6, 10, 17, 0.6);
        color: var(--text);
        font-family: inherit;
      }

      .mic-actions {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      .btn {
        padding: 0.6rem 1.2rem;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .btn-primary {
        background: var(--accent);
        color: #1a1a1a;
      }

      .btn-ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .btn-danger {
        background: rgba(192, 57, 43, 0.2);
        color: #ffb3a8;
        border: 1px solid rgba(192, 57, 43, 0.4);
      }

      .mic-status {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .mic-status.good {
        color: #9af3c5;
      }

      .mic-status.warn {
        color: #ffb3a8;
      }

      .audio-output {
        width: 100%;
      }

      .note {
        font-size: 0.85rem;
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="mic-shell">
      <header class="mic-header">
        <h1>Mic Monitor</h1>
        <p>Send pastor audio from the church laptop to the ICT room.</p>
      </header>

      <div class="mic-grid">
        <section class="mic-card" id="senderCard">
          <h3>Mic Sender (Church Laptop)</h3>
          <label>
            <span>Room ID</span>
            <input type="text" id="sendRoom" value="main" />
          </label>
          <label>
            <span>Microphone</span>
            <select id="micSelect">
              <option value="">Default Microphone</option>
            </select>
          </label>
          <div class="mic-actions">
            <button class="btn btn-primary" id="startSend">Start Mic</button>
            <button class="btn btn-danger" id="stopSend">Stop</button>
          </div>
          <div class="mic-status" id="sendStatus">
            Idle. Click Start Mic to begin.
          </div>
        </section>

        <section class="mic-card" id="listenerCard">
          <h3>Mic Listener (ICT Room)</h3>
          <label>
            <span>Room ID</span>
            <input type="text" id="listenRoom" value="main" />
          </label>
          <div class="mic-actions">
            <button class="btn btn-primary" id="startListen">
              Start Listening
            </button>
            <button class="btn btn-danger" id="stopListen">Stop</button>
          </div>
          <audio class="audio-output" id="audioOutput" controls></audio>
          <div class="mic-status" id="listenStatus">
            Idle. Click Start Listening.
          </div>
          <div class="note">
            Both laptops must be on the same network. This works even without
            internet.
          </div>
        </section>
      </div>
    </div>

    <script>
      const API_URL = "/api";
      const micSelect = document.getElementById("micSelect");
      const sendRoom = document.getElementById("sendRoom");
      const listenRoom = document.getElementById("listenRoom");
      const startSend = document.getElementById("startSend");
      const stopSend = document.getElementById("stopSend");
      const startListen = document.getElementById("startListen");
      const stopListen = document.getElementById("stopListen");
      const sendStatus = document.getElementById("sendStatus");
      const listenStatus = document.getElementById("listenStatus");
      const audioOutput = document.getElementById("audioOutput");

      let senderPc = null;
      let senderStream = null;
      let senderPoll = null;
      let senderIcePoll = null;
      let senderIceSeen = new Set();

      let listenerPc = null;
      let listenerPoll = null;
      let listenerIcePoll = null;
      let listenerIceSeen = new Set();

      function setStatus(el, message, type) {
        if (!el) return;
        el.textContent = message;
        el.className = `mic-status${type ? ` ${type}` : ""}`;
      }

      async function fetchJson(url, options) {
        const res = await fetch(url, options);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const error = data.error || "Request failed";
          throw new Error(error);
        }
        return data;
      }

      async function refreshDevices() {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const mics = devices.filter((device) => device.kind === "audioinput");
          micSelect.innerHTML = '<option value="">Default Microphone</option>';
          mics.forEach((mic) => {
            const option = document.createElement("option");
            option.value = mic.deviceId;
            option.textContent = mic.label || "Microphone";
            micSelect.appendChild(option);
          });
        } catch (error) {
          console.error("Unable to list devices:", error);
        }
      }

      async function startSender() {
        if (senderPc) return;
        const room = sendRoom.value.trim() || "main";
        setStatus(sendStatus, "Requesting microphone access...", "warn");

        try {
          const constraints = {
            audio: micSelect.value ? { deviceId: micSelect.value } : true,
          };
          senderStream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch (error) {
          setStatus(
            sendStatus,
            "Microphone access denied or unavailable.",
            "warn",
          );
          return;
        }

        senderPc = new RTCPeerConnection({ iceServers: [] });
        senderStream.getTracks().forEach((track) => {
          senderPc.addTrack(track, senderStream);
        });

        senderPc.onicecandidate = (event) => {
          if (!event.candidate) return;
          fetchJson(`${API_URL}/webrtc/ice`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              room,
              role: "sender",
              candidate: event.candidate,
            }),
          }).catch(() => {});
        };

        const offer = await senderPc.createOffer();
        await senderPc.setLocalDescription(offer);
        await fetchJson(`${API_URL}/webrtc/offer`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ room, sdp: offer.sdp, type: offer.type }),
        });

        setStatus(sendStatus, "Waiting for listener...", "warn");
        senderPoll = setInterval(async () => {
          try {
            const answer = await fetchJson(
              `${API_URL}/webrtc/answer?room=${encodeURIComponent(room)}`,
            );
            if (senderPc.signalingState !== "stable") {
              await senderPc.setRemoteDescription(
                new RTCSessionDescription(answer),
              );
              setStatus(sendStatus, "Audio streaming live.", "good");
            }
          } catch (error) {
            return;
          }
        }, 1000);

        senderIcePoll = setInterval(async () => {
          try {
            const list = await fetchJson(
              `${API_URL}/webrtc/ice?room=${encodeURIComponent(
                room,
              )}&role=receiver`,
            );
            list.forEach((candidate) => {
              const key = JSON.stringify(candidate);
              if (senderIceSeen.has(key)) return;
              senderIceSeen.add(key);
              senderPc.addIceCandidate(new RTCIceCandidate(candidate)).catch(
                () => {},
              );
            });
          } catch (error) {
            return;
          }
        }, 1500);
      }

      function stopSender() {
        if (senderPoll) clearInterval(senderPoll);
        if (senderIcePoll) clearInterval(senderIcePoll);
        senderPoll = null;
        senderIcePoll = null;
        senderIceSeen = new Set();
        if (senderPc) senderPc.close();
        senderPc = null;
        if (senderStream) {
          senderStream.getTracks().forEach((track) => track.stop());
        }
        senderStream = null;
        setStatus(sendStatus, "Stopped.", "warn");
      }

      async function startListener() {
        if (listenerPc) return;
        const room = listenRoom.value.trim() || "main";
        listenerPc = new RTCPeerConnection({ iceServers: [] });

        listenerPc.ontrack = (event) => {
          if (audioOutput) {
            audioOutput.srcObject = event.streams[0];
          }
        };

        listenerPc.onicecandidate = (event) => {
          if (!event.candidate) return;
          fetchJson(`${API_URL}/webrtc/ice`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              room,
              role: "receiver",
              candidate: event.candidate,
            }),
          }).catch(() => {});
        };

        setStatus(listenStatus, "Waiting for sender...", "warn");
        listenerPoll = setInterval(async () => {
          try {
            const offer = await fetchJson(
              `${API_URL}/webrtc/offer?room=${encodeURIComponent(room)}`,
            );
            if (listenerPc.signalingState === "stable") {
              await listenerPc.setRemoteDescription(
                new RTCSessionDescription(offer),
              );
              const answer = await listenerPc.createAnswer();
              await listenerPc.setLocalDescription(answer);
              await fetchJson(`${API_URL}/webrtc/answer`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  room,
                  sdp: answer.sdp,
                  type: answer.type,
                }),
              });
              setStatus(listenStatus, "Listening live.", "good");
            }
          } catch (error) {
            return;
          }
        }, 1200);

        listenerIcePoll = setInterval(async () => {
          try {
            const list = await fetchJson(
              `${API_URL}/webrtc/ice?room=${encodeURIComponent(
                room,
              )}&role=sender`,
            );
            list.forEach((candidate) => {
              const key = JSON.stringify(candidate);
              if (listenerIceSeen.has(key)) return;
              listenerIceSeen.add(key);
              listenerPc.addIceCandidate(new RTCIceCandidate(candidate)).catch(
                () => {},
              );
            });
          } catch (error) {
            return;
          }
        }, 1500);
      }

      function stopListener() {
        if (listenerPoll) clearInterval(listenerPoll);
        if (listenerIcePoll) clearInterval(listenerIcePoll);
        listenerPoll = null;
        listenerIcePoll = null;
        listenerIceSeen = new Set();
        if (listenerPc) listenerPc.close();
        listenerPc = null;
        if (audioOutput) audioOutput.srcObject = null;
        setStatus(listenStatus, "Stopped.", "warn");
      }

      startSend.addEventListener("click", startSender);
      stopSend.addEventListener("click", stopSender);
      startListen.addEventListener("click", startListener);
      stopListen.addEventListener("click", stopListener);

      window.addEventListener("hashchange", () => {
        const hash = window.location.hash.replace("#", "");
        if (hash === "send") {
          document.getElementById("senderCard").scrollIntoView({
            behavior: "smooth",
          });
        }
        if (hash === "listen") {
          document.getElementById("listenerCard").scrollIntoView({
            behavior: "smooth",
          });
        }
      });

      refreshDevices();
      if (navigator.mediaDevices) {
        navigator.mediaDevices.addEventListener("devicechange", refreshDevices);
      }
    </script>
  </body>
</html>
